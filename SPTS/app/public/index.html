<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SPTS</title></head>
<body>
<script>
fetch('/api/v1/auth/me', { credentials: 'same-origin' })
  .then((r) => r.ok ? window.location.replace('/myshift.html') : window.location.replace('/login.html'))
  .catch(() => window.location.replace('/login.html'));
</script>
