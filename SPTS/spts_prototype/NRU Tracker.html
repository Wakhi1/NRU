<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NRU — Smart Phone Tracking &amp; Data Collection Monitoring</title>
<link rel="stylesheet" href="_ds/broadsheet-3d70675a-5cf4-4c0c-aa61-673de2c9b619/styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="./image-slot.js"></script>
<style>
:root{
  --radius-sm:0;--radius-md:0;--radius-lg:0;
  --ok:var(--color-accent);--warn:var(--color-process-yellow);--bad:var(--color-accent-2);
  --rail:232px;
}
html,body{height:100%}
body{overflow:hidden}
button{font:inherit}
.btn,.input,.seg,.card,.tag,.dialog{border-radius:0}
.btn{white-space:nowrap}
.radio .dot{border-radius:0}
#app{height:100dvh;display:grid;grid-template-rows:auto 1fr;background:var(--color-bg)}

/* ── masthead ─────────────────────────────────────────────── */
.masthead{display:flex;align-items:stretch;gap:var(--space-4);padding:0 var(--space-4);
  border-bottom:2px solid var(--color-text);background:var(--color-bg);min-height:66px}
.mh-mark{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;min-width:0;flex-shrink:1}
.mh-mark .mh-org{min-width:0;overflow:hidden}
.mh-seal{width:38px;height:38px;flex:none;border:1px solid var(--color-text);
  display:grid;place-items:center;font-size:9px;letter-spacing:.06em;text-align:center;line-height:1.05;
  font-family:var(--font-heading);font-weight:600}
.mh-org{font-family:var(--font-heading);font-weight:600;font-size:13px;line-height:1.12;letter-spacing:.02em;text-transform:uppercase}
.mh-org small{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--color-accent-700);font-weight:400}
.mh-title{display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--color-divider);
  padding-left:var(--space-4);min-width:0}
.mh-title strong{font-family:var(--font-heading);font-size:15px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh-title span{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--color-neutral-700)}
.mh-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-2);min-width:0;flex-shrink:1}
.mh-clock{font-size:12px;color:var(--color-neutral-700);white-space:nowrap;font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.live i{width:7px;height:7px;background:var(--ok);display:block;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.icobtn{width:34px;height:34px;display:grid;place-items:center;background:transparent;
  border:1px solid var(--color-divider);cursor:pointer;color:var(--color-text)}
.icobtn:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.icobtn:active{background:color-mix(in srgb,var(--color-text) 14%,transparent)}
.burger{display:none}

/* ── shell ────────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--rail) 1fr;min-height:0}
.rail{border-right:1px solid var(--color-divider);padding:var(--space-3) 0;overflow-y:auto;
  display:flex;flex-direction:column;gap:2px;background:var(--color-bg)}
.rail h6{padding:0 var(--space-4);margin:var(--space-3) 0 var(--space-1);color:var(--color-neutral-600)}
.navitem{display:flex;align-items:center;gap:var(--space-2);padding:9px var(--space-4);
  background:transparent;border:0;border-left:3px solid transparent;cursor:pointer;text-align:left;
  font-size:14px;color:var(--color-text);width:100%}
.navitem:hover{background:color-mix(in srgb,var(--color-accent) 9%,transparent)}
.navitem[aria-current=page]{border-left-color:var(--color-accent);color:var(--color-accent-700);
  background:color-mix(in srgb,var(--color-accent) 12%,transparent);font-family:var(--font-heading);font-weight:600}
.navitem b{margin-left:auto;font-size:11px;font-weight:400;color:var(--color-neutral-600);font-variant-numeric:tabular-nums}
.navitem svg{flex:none}
main{min-height:0;overflow:auto;display:flex;flex-direction:column}
.page{padding:var(--space-4) var(--space-6) var(--space-8);display:flex;flex-direction:column;gap:var(--space-4);flex:1;min-height:0}
.page.flush{padding:0;gap:0}
.page:not(.flush){flex:0 0 auto}
.phead{display:flex;align-items:flex-end;gap:var(--space-4);flex-wrap:wrap}
.phead h2{margin:0}
.phead p{margin:0;max-width:52ch;font-size:13px;color:var(--color-neutral-700)}
.phead .spacer{margin-left:auto}
.kicker{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)}

/* ── bits ─────────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--space-3) var(--space-6);background:var(--color-bg)}
.stat{background:transparent;padding:0;border:0}
.stat b{display:block;font-family:var(--font-heading);font-size:clamp(20px,2vw,30px);line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-neutral-700)}
.stat em{font-style:normal;font-size:11px;color:var(--color-accent-700)}
.dot{width:9px;height:9px;display:inline-block;flex:none}
.dot.online{background:var(--ok)}.dot.idle{background:var(--warn)}.dot.offline{background:var(--bad)}
.bar{height:6px;background:var(--color-neutral-300);position:relative;flex:1;min-width:60px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--color-accent);display:block}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.row{display:flex;align-items:center;gap:var(--space-2)}
.mono{font-variant-numeric:tabular-nums;font-size:13px}
.tbl-wrap{border-top:1px solid var(--color-text);overflow-x:auto;overflow-y:visible;flex:none}
.table tbody tr{cursor:pointer}
.table td{white-space:nowrap}
.table th{white-space:nowrap}
.chips{display:flex;gap:var(--space-2);flex-wrap:wrap}
.chip{padding:5px 12px;font-size:12px;border:1px solid var(--color-divider);background:transparent;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;color:var(--color-text)}
.chip:hover{background:color-mix(in srgb,var(--color-text) 6%,transparent)}
.chip[aria-pressed=true]{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-bg)}
.chip[aria-pressed=true] .dot{box-shadow:0 0 0 1px var(--color-bg)}
.listrow{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);
  border-bottom:1px solid color-mix(in srgb,var(--color-text) 9%,transparent);cursor:pointer;
  background:transparent;width:100%;text-align:left;color:var(--color-text)}
.listrow:hover{background:color-mix(in srgb,var(--color-accent) 8%,transparent)}
.listrow[aria-selected=true]{background:color-mix(in srgb,var(--color-accent) 15%,transparent);
  box-shadow:inset 3px 0 0 var(--color-accent)}
.listrow .who{min-width:0;flex:1}
.listrow .who b{display:block;font-family:var(--font-heading);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listrow .who span{font-size:11px;color:var(--color-neutral-700);display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sect{display:flex;flex-direction:column;gap:var(--space-2)}
.sect > h4{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px var(--space-3);font-size:13px}
.kv dt{color:var(--color-neutral-700);font-size:12px}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--color-neutral-700);border-left:2px solid var(--color-accent);padding-left:var(--space-2)}

/* ── map ──────────────────────────────────────────────────── */
.mapgrid.pane-off{grid-template-columns:1fr}
.mapgrid.pane-off .mappanel{display:none}
.railfoot{margin-top:auto;padding:var(--space-3) var(--space-4);border-top:1px solid var(--color-divider);
  display:flex;flex-direction:column;gap:2px;font-size:11px;line-height:1.35}
.railfoot b{font-family:var(--font-heading);font-size:13px}
.rolepick{display:flex;align-items:center;gap:var(--space-2)}
.rolepick span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-700)}
.rolepick select{min-height:30px;font-size:12px;width:auto;min-width:0;max-width:186px;background:var(--color-bg);border-color:var(--color-text)}
.mapgrid{display:grid;grid-template-columns:320px 1fr;flex:1;min-height:0}
.mappanel{border-right:1px solid var(--color-divider);display:flex;flex-direction:column;min-height:0}
.mappanel .top{padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2);
  border-bottom:1px solid var(--color-text)}
.mappanel .scroll{overflow-y:auto;min-height:0;flex:1}
.mapstage{position:relative;min-height:320px}
.leafmap{position:absolute;inset:0;background:var(--color-neutral-200)}
.leaflet-container{font-family:var(--font-body)}
.leaflet-tile-pane{transition:filter .3s}
.view-news .leaflet-tile-pane{filter:grayscale(1) contrast(1.18) brightness(1.06)}
.view-ink .leaflet-tile-pane{filter:grayscale(1) contrast(.75) brightness(1.12) sepia(.35) hue-rotate(150deg) saturate(2.2)}
.nolabel .leaflet-tile-pane{filter:grayscale(1) contrast(.9) brightness(1.1) opacity(.55)}
.mapctl{position:absolute;z-index:500;display:flex;flex-direction:column;gap:1px;background:var(--color-divider);
  border:1px solid var(--color-text)}
.mapctl button{width:34px;height:34px;background:var(--color-bg);border:0;cursor:pointer;color:var(--color-text);
  display:grid;place-items:center;font-size:15px;font-family:var(--font-heading)}
.mapctl button:hover{background:var(--color-accent);color:var(--color-bg)}
.mapctl.zoom{top:var(--space-3);right:var(--space-3)}
.maptools{position:absolute;top:var(--space-3);left:var(--space-3);z-index:500;display:flex;flex-direction:column;gap:var(--space-2);
  align-items:flex-start;max-width:calc(100% - 90px)}
.panelbox{background:color-mix(in srgb,var(--color-bg) 92%,transparent);border:1px solid var(--color-text);
  padding:var(--space-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center;backdrop-filter:blur(3px)}
.seg2{display:inline-flex;border:1px solid var(--color-text)}
.seg2 button{padding:5px 11px;font-size:12px;background:var(--color-bg);border:0;cursor:pointer;color:var(--color-text)}
.seg2 button + button{border-left:1px solid var(--color-divider)}
.seg2 button[aria-pressed=true]{background:var(--color-text);color:var(--color-bg)}
.legend{position:absolute;bottom:var(--space-3);left:var(--space-3);z-index:500;font-size:11px;
  background:color-mix(in srgb,var(--color-bg) 92%,transparent);border:1px solid var(--color-text);padding:var(--space-2);
  display:flex;flex-direction:column;gap:4px}
.legend .row{gap:6px}
.pin{width:16px;height:16px;border:1.5px solid var(--color-bg);box-shadow:0 0 0 1px var(--color-text);
  display:grid;place-items:center}
.pin.online{background:var(--ok)}.pin.idle{background:var(--warn)}.pin.offline{background:var(--bad)}
.pin.sel{outline:3px solid var(--color-text);outline-offset:2px}
.pin small{color:#fff;font-size:8px;line-height:1}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{border-radius:0;background:var(--color-bg);
  box-shadow:var(--shadow-md);font-family:var(--font-body)}
.leaflet-popup-content{margin:10px 12px;font-size:13px}
.leaflet-bar a,.leaflet-control-attribution{border-radius:0!important}
.leaflet-control-attribution{font-size:9px;font-family:var(--font-body)}

/* ── drawer ───────────────────────────────────────────────── */
#scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--color-neutral-900) 34%,transparent);
  z-index:900;opacity:0;pointer-events:none;transition:opacity .22s}
#scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,92vw);background:var(--color-bg);
  border-left:2px solid var(--color-text);box-shadow:var(--shadow-lg);z-index:950;
  transform:translateX(102%);transition:transform .26s cubic-bezier(.2,.7,.2,1);
  display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-head{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-text);
  display:flex;align-items:flex-start;gap:var(--space-3)}
.dr-head h3{margin:0;font-size:22px}
.dr-head .kicker{margin-bottom:3px}
.dr-body{overflow-y:auto;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-4);flex:1}
.dr-foot{padding:var(--space-3) var(--space-4);border-top:1px solid var(--color-divider);
  display:flex;gap:var(--space-2);flex-wrap:wrap}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--color-divider)}
.tabs button{padding:8px 12px;background:transparent;border:0;border-bottom:2px solid transparent;cursor:pointer;
  font-size:13px;color:var(--color-neutral-700)}
.tabs button[aria-selected=true]{border-bottom-color:var(--color-accent);color:var(--color-accent-700);
  font-family:var(--font-heading);font-weight:600}
.spark{display:flex;align-items:flex-end;gap:3px;height:54px}
.spark i{flex:1;background:var(--color-accent-300);display:block;min-height:2px}
.spark i.hi{background:var(--color-accent)}
.trail{display:flex;flex-direction:column;gap:0}
.trail li{list-style:none;display:grid;grid-template-columns:56px 1fr;gap:var(--space-2);font-size:12px;
  padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent)}
.trail time{color:var(--color-neutral-600);font-variant-numeric:tabular-nums}
ul.plain{margin:0;padding:0}
ul.plain li{list-style:none}

/* ── phone ────────────────────────────────────────────────── */
.phonewrap{display:flex;gap:var(--space-6);flex-wrap:wrap;align-items:flex-start}
.phone{width:344px;border:2px solid var(--color-text);background:var(--color-bg);display:flex;flex-direction:column;
  height:684px;box-shadow:var(--shadow-md)}
.phone .sb{display:flex;justify-content:space-between;padding:6px 12px;font-size:11px;
  border-bottom:1px solid var(--color-divider);font-variant-numeric:tabular-nums}
.phone .apphead{padding:var(--space-3);border-bottom:1px solid var(--color-text)}
.phone .body{flex:1;overflow-y:auto}
.phone .tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--color-text)}
.phone .tabbar button{padding:9px 4px;background:transparent;border:0;font-size:10.5px;cursor:pointer;
  letter-spacing:.04em;text-transform:uppercase;color:var(--color-neutral-700);display:grid;gap:3px;justify-items:center}
.phone .tabbar button[aria-pressed=true]{background:var(--color-text);color:var(--color-bg)}
.taskcard{padding:var(--space-3);border-bottom:1px solid color-mix(in srgb,var(--color-text) 10%,transparent);
  display:flex;flex-direction:column;gap:6px;cursor:pointer;background:transparent;width:100%;text-align:left;color:var(--color-text)}
.taskcard:hover{background:color-mix(in srgb,var(--color-accent) 8%,transparent)}

/* ── responsive ───────────────────────────────────────────── */
.av{display:grid;place-items:center;flex:none;overflow:hidden;background:var(--color-neutral-200);
  border:1px solid var(--color-text);font-family:var(--font-heading);font-weight:600;
  color:var(--color-neutral-700);line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.06)}
.av.online{box-shadow:inset 0 -3px 0 var(--ok)}
.av.idle{box-shadow:inset 0 -3px 0 var(--warn)}
.av.offline{box-shadow:inset 0 -3px 0 var(--bad)}
.portrait{width:116px;height:146px;border:1px solid var(--color-text);flex:none}
.callbar{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);
  border:1px solid var(--color-text);background:color-mix(in srgb,var(--color-accent) 8%,transparent)}
.calltime{font-family:var(--font-heading);font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.callkeys{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2)}
.callkeys button{padding:10px 0;border:1px solid var(--color-divider);background:transparent;cursor:pointer;
  font-size:13px;color:var(--color-text);min-height:44px}
.callkeys button:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--space-4)}
.photo{display:flex;flex-direction:column;gap:6px;background:transparent;border:0;padding:0;
  text-align:left;color:var(--color-text);cursor:pointer}
.photo .frame{position:relative;height:158px;border:1px solid var(--color-text)}
.photo .stamp{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:10px;
  background:color-mix(in srgb,var(--color-bg) 88%,transparent);border-top:1px solid var(--color-text);
  font-variant-numeric:tabular-nums;pointer-events:none;display:flex;justify-content:space-between;gap:6px}
.gate{padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-3)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;background:var(--color-neutral-300);display:block}
.steps i.on{background:var(--color-accent)}
.toolbar{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;margin-bottom:var(--space-2)}
.note.alert{border-left-color:var(--color-accent-2)}

@media (max-width:1180px){
  :root{--rail:60px}
  .navitem{justify-content:center;padding:11px 0;gap:0}
  .navitem span,.navitem b,.rail h6{display:none}
  .railfoot{display:none}
  .rolepick span{display:none}
  .rolepick select{max-width:132px}
  .mh-org{display:none}
  .mh-clock{display:none}
  .mapgrid{grid-template-columns:274px 1fr}
  .page{padding:var(--space-4) var(--space-4) var(--space-6)}
}
@media (max-width:900px){
  .mapgrid{grid-template-columns:1fr;grid-template-rows:auto minmax(300px,1fr)}
  .mapgrid.pane-off{grid-template-rows:1fr}
  .mappanel{border-right:0;border-bottom:1px solid var(--color-text);max-height:38vh}
  .mh-title{display:none}
}
@media (max-width:680px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;top:0;bottom:0;left:0;width:230px;z-index:960;background:var(--color-bg);
    border-right:2px solid var(--color-text);transform:translateX(-102%);transition:transform .24s;padding-top:var(--space-4)}
  .rail.on{transform:none}
  .rail h6,.navitem span,.navitem b{display:revert}
  .railfoot{display:flex}
  .navitem{justify-content:flex-start;padding:10px var(--space-4);gap:var(--space-2)}
  .burger{display:grid}
  .drawer{width:100%;top:auto;height:86dvh;border-left:0;border-top:2px solid var(--color-text);
    transform:translateY(102%)}
  .drawer.on{transform:none}
  .mh-clock{display:none}
  .page{padding:var(--space-3) var(--space-3) var(--space-6)}
  .phone{width:100%;max-width:344px}
}
</style>
</head>
<body>
<div id="app">
  <header class="masthead">
    <button class="icobtn burger" id="burger" aria-label="Menu">☰</button>
    <div class="mh-mark">
      <div class="mh-seal">NRU</div>
      <div class="mh-org">United Nations<br>and Religions<small>World Organization</small></div>
    </div>
    <div class="mh-title">
      <strong>Smart Phone Tracking &amp; Data Collection Monitoring</strong>
      <span>Information Technology Department · Control Room</span>
    </div>
    <div class="mh-right">
      <label class="rolepick"><span>Viewing as</span>
        <select class="input" id="role">
          <option value="sup">Control-room supervisor</option>
          <option value="it">Head of IT</option>
          <option value="mgr">Department manager</option>
          <option value="dq">Data quality officer</option>
          <option value="exec">Executive</option>
          <option value="col">Field collector</option>
        </select></label>
      <span class="live"><i></i>Live</span>
      <span class="mh-clock" id="clock"></span>
      <button class="icobtn" id="refresh" title="Force refresh">⟳</button>
    </div>
  </header>
  <div class="shell">
    <nav class="rail" id="rail"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-label="Details"></aside>

<script>
/* ══ data ══════════════════════════════════════════════════════════════ */
const AREA = {Manzini:[-26.4988,31.3800],Matsapha:[-26.5167,31.3060],Mbabane:[-26.3167,31.1333],

  const p=PHOTOS['emp-'+id];

    p?`<img src="${p}" alt="">`:esc(initials(name))}</span>`;

function loadPhotos(){
  fetch('.image-slots.state.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j)return; let got=false;
    Object.entries(j).forEach(([k,v])=>{const u=typeof v==='string'?v:(v&&v.u);
      if(u&&String(u).startsWith('data:image/')){PHOTOS[k]=u;got=true;}});
    if(got){render();if(S.drawer)paintDrawer();}
  }).catch(()=>{});
}

  :c==='stale'?'<span class="tag tag-neutral">Re-confirmation due</span>'

function callBack(c){ /* resolve the other party by extension across every employee device */
  const p=everyone().find(x=>x.ext===c.ext);
  if(p)return `<button class="btn btn-primary" data-call="${p.id}">Call ${esc(p.user.split(' ')[0])} back</button>`;
  if(c.dir==='grp')return '<button class="btn btn-primary" data-act="Rejoining the team call — 4 participants, on-net">Rejoin team call</button>';
  return '<button class="btn btn-primary" data-act="Dialling the external number over the SIP trunk — billed centrally, not to the handset">Call via trunk</button>';
}
function callHistory(name){
  const cs=CALLS.filter(c=>c.who===name);
  if(!cs.length)return '<div class="sect"><h4>Voice</h4><div class="text-muted" style="font-size:13px">No calls today. Voice runs on the data bundle — on-net calls cost nothing beyond it.</div></div>';
  return `<div class="sect"><h4>Voice — today</h4>${cs.map(c=>
    `<button class="listrow" data-drawer="call:${c.id}"><span class="mono" style="width:42px;color:var(--color-neutral-600)">${c.start}</span>

function zoneOf(d){ /* a handset's assigned zone is its team's geofence, not where it happens to be */

function renderNav(){
  rail.innerHTML=NAV.map(([grp,items])=>{
    const vis=items.filter(([k])=>allowed(k)); if(!vis.length)return '';
    return '<h6>'+grp+'</h6>'+vis.map(([k,label,ico,count])=>
    `<button class="navitem" data-nav="${k}" ${S.screen===k?'aria-current="page"':''} title="${label}">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="13" fill="currentColor">${ico}</text></svg>
      <span>${label}</span>${count?`<b>${count()}</b>`:''}</button>`).join('');
  }).join('')+
  `<div class="railfoot"><div class="kicker">Signed in as</div><b>${esc(ROLES[S.role].who)}</b>
     <span>${ROLES[S.role].label}</span><span class="text-muted">${ROLES[S.role].scope}</span></div>`;
}
function tick(){
  const d=new Date();
  $('#clock').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' · Mbabane';
}
setInterval(tick,10000); tick();

function go(k){
  if(!allowed(k)){openDrawer('act','The '+ROLES[S.role].label+' role cannot open that view. Ask the Head of IT for access.');return;}
  S.screen=k;localStorage.setItem('nru.track.screen',k);rail.classList.remove('on');closeDrawer();renderNav();render();}

  document.querySelectorAll('[aria-selected=true]').forEach(e=>e.setAttribute('aria-selected','false'));}
scrim.onclick=closeDrawer;

       <button class="btn btn-secondary" data-act="Call ${c.id} note added to the shift record">Add note</button>`);
  }
  else if(kind==='live'){
    const p=person(id)||DEVICES[0];
    drawer.innerHTML=drawerShell('Voice over IP','Calling '+p.user,'ext '+p.ext+' · on-net, no airtime',null,
      `<div class="callbar">${avatar(p.id,p.user,52,p.status)}
        <div><div class="kicker">${p.status==='offline'?'Unreachable':'Connected'}</div>
          <div class="calltime" id="calltime">00:0${p.status==='offline'?'0':'2'}</div>
          <div class="text-muted" style="font-size:11px">Opus 16 kbit/s · ${p.status==='offline'?'no data connection':'good'}</div></div></div>
       ${p.status==='offline'?'<div class="note alert">The handset has no data connection. The call is queued and the officer sees a missed-call card at the next sync.</div>':''}
       <div class="callkeys">

        <button data-act="Call recording started — the officer is notified">Record</button>
        <button data-act="Control room transferred the call">Transfer</button></div>
       <dl class="kv">${kvRow('Charge','E 0.00 — on-net')}${kvRow('Data','≈ 7 MB per hour')}${kvRow('Fallback','Push-to-talk on weak signal')}</dl>`,
      `<button class="btn btn-primary" data-act="Call ended · 0:02 · no airtime consumed" style="background:var(--color-accent-2)">End call</button>
       <button class="btn btn-secondary" data-drawer="${p.kind==='Field'?'device':'staff'}:${p.id}">Open profile</button>`);
  }
  else if(kind==='proof'){
    const p=PROOF.find(x=>x.id===id),d=dev(p.dev);
    drawer.innerHTML=drawerShell('Photograph '+p.id,esc(p.what),'Record '+p.form+' · '+p.time,null,
      `<div style="height:210px;border:1px solid var(--color-text)">
        <image-slot id="proofbig-${p.id}" shape="rect" placeholder="Drop the field photograph"></image-slot></div>
       <dl class="kv">${kvRow('Taken by',esc(d.user)+' · '+p.dev)}${kvRow('Time',p.time)}
        ${kvRow('Position',d.lat.toFixed(4)+', '+d.lng.toFixed(4))}${kvRow('Accuracy','±'+p.acc+' m')}
        ${kvRow('Zone at capture',p.zone)}${kvRow('Camera','Rear · flash off')}
        ${kvRow('Stamp','Written by the handset, not editable')}</dl>
       ${p.state==='flagged'?'<div class="note alert">Captured outside any assigned zone — the record it belongs to is held for review.</div>'
        :'<div class="note">Position matches the submitted record within tolerance.</div>'}`,
      `<button class="btn btn-primary" data-act="${p.id} accepted as proof for ${p.form}">Accept</button>
       <button class="btn btn-secondary" data-act="${p.id} sent back to ${p.dev} for re-capture">Send back</button>
       <button class="btn btn-secondary" data-drawer="device:${p.dev}">Open handset</button>`);
  }
  else if(kind==='act'){
    drawer.innerHTML=drawerShell('Action','Confirmed',new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),null,
      `<p style="font-size:15px">${esc(id)}</p><div class="note">Logged to the control-room audit trail.</div>`,
      `<button class="btn btn-secondary" data-close>Dismiss</button>`);
  }
}

function head(k,t,p){return `<div class="phead"><div><div class="kicker">${k}</div><h2>${t}</h2></div><p>${p}</p></div>`;}
function stats(rows){return `<div class="stats">${rows.map(r=>`<div class="stat"><b>${r[0]}</b><span>${r[1]}</span>${r[2]?`<em>${r[2]}</em>`:''}</div>`).join('')}</div>`;}
function rowDevice(d){return `<button class="listrow" data-drawer="device:${d.id}" data-devrow="${d.id}" ${S.sel===d.id?'aria-selected="true"':''}>

    <span class="mono" style="font-size:11px">${d.bat}% · ${d.rec}/${d.tgt}</span>
    <span class="bar ${batCls(d.bat)}" style="width:54px;min-width:0"><i style="width:${d.bat}%"></i></span></span></button>`;}

/* ══ leaflet ═══════════════════════════════════════════════════════════ */
let M1,M2,layers={marks:[],fences:[],trail:null},M2layers={},saved={};
function reuse(m,key){ /* render() replaces main.innerHTML — drop a map whose container was destroyed */
  if(!m)return null;
  if(document.body.contains(m.getContainer()))return m;
  saved[key]={c:m.getCenter(),z:m.getZoom()}; m.remove(); return null;}
function tiles(){const b=BASES[S.base];return L.tileLayer(b.url,{attribution:b.attr,maxZoom:b.max});}
function pinIcon(d){return L.divIcon({className:'',iconSize:[16,16],iconAnchor:[8,8],
  html:`<div class="pin ${d.status}${S.sel===d.id?' sel':''}"><small>${d.id.slice(-2)}</small></div>`});}

function drawMap1(){
  M1=reuse(M1,'m1');
  if(!M1){
    const v=saved.m1;
    M1=L.map('map1',{zoomControl:false,attributionControl:true}).setView(v?v.c:[-26.44,31.28],v?v.z:10);
    layers.base=tiles().addTo(M1);
  }
  layers.marks.forEach(m=>M1.removeLayer(m)); layers.fences.forEach(f=>M1.removeLayer(f));
  if(layers.trail){M1.removeLayer(layers.trail);layers.trail=null;}
  layers.marks=filtered().map(d=>{
    const m=L.marker([d.lat,d.lng],{icon:pinIcon(d)}).addTo(M1)
      .bindPopup(`<b>${esc(d.user)}</b><br>${d.id} · ${d.status}<br>${d.bat}% battery · ${d.acc} m accuracy`);
    m.on('click',()=>{S.sel=d.id;openDrawer('device',d.id);syncSel();});
    return m;});
  if(S.layers.geo) layers.fences=GEOFENCES.map(g=>L.circle(AREA[g.at],{radius:g.r,color:g.active?'#0088b0':'#7d7979',
      weight:1.5,dashArray:g.active?null:'4 4',fillColor:'#0088b0',fillOpacity:.07})
      .addTo(M1).on('click',()=>openDrawer('geo',g.id)));
  if(S.layers.trail) layers.trail=L.polyline(TRAIL.map(t=>t[2]),{color:'#d6006c',weight:2.5,opacity:.85}).addTo(M1);
  setTimeout(()=>M1.invalidateSize(),60);
}
function drawMap2(){
  M2=reuse(M2,'m2');
  if(!M2){const v=saved.m2;M2layers={};
    M2=L.map('map2',{zoomControl:false}).setView(v?v.c:TRAIL[4][2],v?v.z:13);M2layers.base=[tiles().addTo(M2)];}
  Object.entries(M2layers).forEach(([k,v])=>{if(k!=='base')v.forEach(l=>{if(M2.hasLayer(l))M2.removeLayer(l);});});
  const pts=TRAIL.slice(0,S.tIdx+1).map(t=>t[2]);
  M2layers.line=[L.polyline(TRAIL.map(t=>t[2]),{color:'#7d7979',weight:1.5,dashArray:'3 5'}).addTo(M2),
    L.polyline(pts,{color:'#d6006c',weight:3}).addTo(M2)];
  M2layers.dots=TRAIL.map((t,i)=>L.circleMarker(t[2],{radius:i===S.tIdx?7:4,color:'#201e1d',weight:1,
    fillColor:i===S.tIdx?'#0088b0':(i<=S.tIdx?'#d6006c':'#f3f2f2'),fillOpacity:1})
    .addTo(M2).on('click',()=>openDrawer('trail',i)).bindTooltip(t[0]+' — '+t[1]));
  M2.panTo(TRAIL[S.tIdx][2],{animate:true});
  setTimeout(()=>M2.invalidateSize(),60);
}
function syncSel(){
  document.querySelectorAll('[data-devrow]').forEach(e=>e.setAttribute('aria-selected',String(e.dataset.devrow===S.sel)));
  layers.marks.forEach((m,i)=>{const d=filtered()[i];if(d)m.setIcon(pinIcon(d));});
}

/* ══ render + events ═══════════════════════════════════════════════════ */
function render(){
  if(S.screen!=='history'&&S.play)setPlay(false);
  main.innerHTML=screens[S.screen]();
  main.scrollTop=0;
  if(S.screen==='map')drawMap1();
  if(S.screen==='history')drawMap2();
}
function stageClass(){
  const st=document.querySelector('.mapstage'); if(!st)return;
  st.className='mapstage view-'+S.view+(S.screen==='map'&&!S.layers.labels?' nolabel':'');
}
let timer=null;
function stepTo(i){ /* light playback update — never re-renders the map container */
  S.tIdx=i;
  const t=TRAIL[S.tIdx], sc=$('#scrub'), lb=$('#ptime'), lg=$('#plegend');
  if(sc)sc.value=S.tIdx; if(lb)lb.textContent=t[0]; if(lg)lg.textContent='Position at '+t[0];
  document.querySelectorAll('[data-trailidx]').forEach(e=>e.setAttribute('aria-selected',String(+e.dataset.trailidx===S.tIdx)));
  drawMap2();
}
function setPlay(on){
  S.play=on; if(timer){clearInterval(timer);timer=null;}
  const b=document.querySelector('[data-play]'); if(b)b.textContent=on?'❙❙ Pause':'▶ Play';
  if(on)timer=setInterval(()=>{if(S.screen!=='history'){setPlay(false);return;}stepTo((S.tIdx+1)%TRAIL.length);},1100);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-drawer],[data-filter],[data-view],[data-base],[data-pane],[data-layer],[data-map],[data-tab],[data-close],[data-act],[data-trailidx],[data-play],[data-ctab],[data-goto],[data-staff],[data-proof],[data-call],[data-gate]');
  if(!t)return;
  if(t.dataset.call){openDrawer('live',t.dataset.call);return;}
  if(t.dataset.staff){S.staffFilter=t.dataset.staff;render();return;}
  if(t.dataset.proof){S.proofFilter=t.dataset.proof;render();return;}
  if(t.dataset.gate){const g=t.dataset.gate;
    if(g==='fix'){S.gateFix=true;S.gate=1;}
    else if(g==='next')S.gate=2;
    else if(g==='start'){S.shift=true;S.collectorTab=0;}
    else if(g==='end'){S.shift=false;S.gate=0;S.gateFix=false;}
    render();
    if(g==='start')openDrawer('act','Shift started 07:12 \u2014 position confirmed 40 m inside Manzini CBD, check-in photograph on file.');
    if(g==='end')openDrawer('act','Shift ended \u2014 location sharing stopped, re-check-in required at next login.');
    return;}
  if(t.dataset.close!==undefined){closeDrawer();return;}
  if(t.dataset.nav){go(t.dataset.nav);return;}
  if(t.dataset.act){const g=t.dataset.goto;openDrawer('act',t.dataset.act);if(g&&allowed(g)){S.screen=g;localStorage.setItem('nru.track.screen',g);renderNav();render();}return;}
  if(t.dataset.goto){go(t.dataset.goto);return;}
  if(t.dataset.drawer){const [k,id]=t.dataset.drawer.split(':');
    if(k==='device'){S.sel=id;syncSel();}
    openDrawer(k,id);return;}
  if(t.dataset.filter){const f=t.dataset.filter;
    S.filters.has(f)?S.filters.delete(f):S.filters.add(f);
    t.setAttribute('aria-pressed',String(S.filters.has(f)));
    const list=filtered(), box=$('#devlist');
    if(box)box.innerHTML=list.map(d=>rowDevice(d)).join('');
    const h=document.querySelector('.mappanel .top h4'); if(h)h.textContent=list.length+' handsets shown';
    drawMap1();return;}
  if(t.dataset.base){S.base=t.dataset.base;
    document.querySelectorAll('[data-base]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.base===S.base)));
    if(S.screen==='history'&&M2){if(M2layers.base)M2layers.base.forEach(l=>M2.removeLayer(l));M2layers.base=[tiles().addTo(M2)];}
    else if(M1){if(layers.base)M1.removeLayer(layers.base);layers.base=tiles().addTo(M1);}
    return;}
  if(t.dataset.pane!==undefined){S.pane=!S.pane;render();
    setTimeout(()=>{if(M1)M1.invalidateSize();},80);return;}
  if(t.dataset.view){S.view=t.dataset.view;
    document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===S.view)));
    stageClass();return;}
  if(t.dataset.layer){const k=t.dataset.layer;S.layers[k]=!S.layers[k];
    t.setAttribute('aria-pressed',String(S.layers[k]));
    stageClass(); if(k!=='labels')drawMap1();return;}
  if(t.dataset.tab){S.tab=+t.dataset.tab;paintDrawer();return;}
  if(t.dataset.trailidx){setPlay(false);stepTo(+t.dataset.trailidx);openDrawer('trail',t.dataset.trailidx);return;}
  if(t.dataset.play!==undefined){setPlay(!S.play);return;}
  if(t.dataset.ctab){S.collectorTab=+t.dataset.ctab;render();return;}
  if(t.dataset.map){
    const M=S.screen==='history'?M2:M1; if(!M)return;
    const a=t.dataset.map;
    if(a==='in')M.zoomIn(); else if(a==='out')M.zoomOut();
    else if(a==='fit'){const pts=S.screen==='history'?TRAIL.map(x=>x[2]):filtered().map(d=>[d.lat,d.lng]);
      if(pts.length)M.fitBounds(pts,{padding:[50,50]});}
    else if(a==='loc'){const d=dev(S.sel)||filtered()[0];if(d)M.setView([d.lat,d.lng],14);}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='scrub'){setPlay(false);stepTo(+e.target.value);}
  if(e.target.id==='q'){const q=e.target.value.toLowerCase();
    document.querySelectorAll('#devlist [data-devrow]').forEach(r=>{
      const d=dev(r.dataset.devrow);
      r.style.display=(d.user+d.id+d.team).toLowerCase().includes(q)?'':'none';});}
});
$('#burger').onclick=()=>rail.classList.toggle('on');
$('#role').onchange=e=>{S.role=e.target.value;localStorage.setItem('nru.track.role',S.role);
  if(!allowed(S.screen))S.screen=ROLES[S.role].screens[0];
  localStorage.setItem('nru.track.screen',S.screen);closeDrawer();renderNav();render();};
$('#refresh').onclick=()=>{jitter();render();openDrawer('act','Fleet polled — 10 of 12 handsets returned a fresh position.');};

/* gentle liveness: online handsets drift, last-fix counters age */
function jitter(){
  DEVICES.forEach(d=>{
    if(d.status==='online'){d.lat+=(Math.random()-.5)*.0016;d.lng+=(Math.random()-.5)*.0016;d.seen=0;}
    else d.seen+=1;
  });
}
setInterval(()=>{jitter();if(S.screen==='map'){const keep=S.sel;drawMap1();S.sel=keep;syncSel();}},9000);

const savedRole=localStorage.getItem('nru.track.role');
if(ROLES[savedRole])S.role=savedRole;
if(!allowed(S.screen))S.screen=ROLES[S.role].screens[0];
$('#role').value=S.role;
renderNav();render();loadPhotos();
</script>
</body>
</html>
